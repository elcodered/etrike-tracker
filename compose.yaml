services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: etrike_tracking
      POSTGRES_USER: etrike_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etrike_app -d etrike_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: E-Trike Operations
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY in root .env}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: etrike_tracking
      DB_USERNAME: etrike_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_COOKIE: etrike_session
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_SAME_SITE: lax
      CACHE_STORE: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped
volumes:
  postgres_data:
