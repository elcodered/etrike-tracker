server {
    listen 80;
    listen [::]:80;
    server_name etrike.bnbtctracker.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://etrike.bnbtctracker.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name etrike.bnbtctracker.com;
    ssl_certificate /etc/letsencrypt/live/etrike.bnbtctracker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etrike.bnbtctracker.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/etrike-app.conf;
}
